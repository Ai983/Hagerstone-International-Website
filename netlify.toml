# Netlify Configuration for Hagerstone Website

[build]
  command = "npm run build && npm run build:server && npm run build:prerender"
  publish = "dist"

# Legacy URLs from the previous website. Google still crawls these years on
# (they surfaced in Search Console as "crawled - currently not indexed" and one
# soft 404), and each currently returns a hard 404 — so any link equity those
# pages earned is being thrown away. Each points at the closest genuinely
# related page; an irrelevant redirect is treated as a soft 404 and recovers
# nothing. Kept in sync with the same list in vercel.json.
#
# TODO: repoint the hospital one at a healthcare-interiors page when one exists
# (Max Hospital Saket is real delivered proof).
[[redirects]]
  from = "/blog/office-interiors-noida"
  to = "/locations/noida"
  status = 301
  force = true

[[redirects]]
  from = "/blog/international-interior-designers-in-india-choose-right-firm"
  to = "/blog/commercial-interior-designers"
  status = 301
  force = true

[[redirects]]
  from = "/blog/corporate-office-design-guide-delhi-ncr"
  to = "/blog/office-workspace-design"
  status = 301
  force = true

[[redirects]]
  from = "/21-problems-faced-by-most-interior-designers-firms"
  to = "/blog/commercial-interior-designers"
  status = 301
  force = true

[[redirects]]
  from = "/blog/hospital-interior-designers-patient-centered-guide"
  to = "/services/interior-fit-out"
  status = 301
  force = true

# Serve static SEO files directly (before SPA redirect)
[[redirects]]
  from = "http://hagerstone.com/*"
  to = "https://hagerstone.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.hagerstone.com/*"
  to = "https://hagerstone.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.hagerstone.com/*"
  to = "https://hagerstone.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

# SPA Redirect - Handle all client-side routes (fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.avif"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache videos
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.webm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SEO files - shorter cache for updates
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"
